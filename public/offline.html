<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Awami Kam</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F7F8F5; color: #14201A; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
    h1 { color: #0B6B3A; font-size: 24px; margin-bottom: 8px; }
    p { color: #6B7A72; font-size: 14px; max-width: 320px; line-height: 1.5; margin-bottom: 24px; }
    button { background: #0B6B3A; color: white; border: none; padding: 12px 24px; border-radius: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>انٹرنیٹ کنکشن نہیں ہے (Offline)</h1>
  <p>Please check your internet connection. Awami Kam will reconnect automatically when network is restored.</p>
  <button onclick="window.location.reload()">دوبارہ کوشش کریں (Retry)</button>
</body>
</html>
